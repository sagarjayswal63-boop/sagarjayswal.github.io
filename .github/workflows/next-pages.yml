name: Validate Next static export
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'tests/**'
      - '.static-export-source.sha256'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: python3 scripts/sync-export.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
