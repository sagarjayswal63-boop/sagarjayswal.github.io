<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Screw assembly: verified completion</title><desc id="desc">Controller feedback governs the PLC completion decision.</desc><rect width="800" height="520" fill="#09090b"/><g font-family="Arial, sans-serif"><text x="48" y="40" fill="#fb7185" font-size="12" letter-spacing="2">SAGAR JAYSWAL / ENGINEERING WORKFLOW</text><text x="48" y="78" fill="#fafafa" font-size="27" font-weight="700">Screw assembly: verified completion</text><text x="48" y="105" fill="#b5b5be" font-size="15">Controller feedback governs the PLC completion decision.</text><rect x="48" y="128" width="704" height="62" rx="10" fill="#151519" stroke="#38383f"/><text x="68" y="153" fill="#fb7185" font-size="14">01</text><text x="112" y="153" fill="#f5f5f5" font-size="18" font-weight="600">Fasten the assembly</text><text x="112" y="175" fill="#b5b5be" font-size="14">Operator-triggered screwdriver; 14-fastener batch.</text><rect x="48" y="205" width="704" height="62" rx="10" fill="#151519" stroke="#38383f"/><text x="68" y="230" fill="#fb7185" font-size="14">02</text><text x="112" y="230" fill="#f5f5f5" font-size="18" font-weight="600">Verify the controller batch</text><text x="112" y="252" fill="#b5b5be" font-size="14">OK / NG feedback and controller batch-complete signal.</text><rect x="48" y="282" width="704" height="62" rx="10" fill="#151519" stroke="#38383f"/><text x="68" y="307" fill="#fb7185" font-size="14">03</text><text x="112" y="307" fill="#f5f5f5" font-size="18" font-weight="600">Capture completion in the PLC</text><text x="112" y="329" fill="#b5b5be" font-size="14">Retain the short batch-complete pulse for sequencing.</text><rect x="48" y="359" width="704" height="62" rx="10" fill="#151519" stroke="#38383f"/><text x="68" y="384" fill="#fb7185" font-size="14">04</text><text x="112" y="384" fill="#f5f5f5" font-size="18" font-weight="600">Permit fixture release</text><text x="112" y="406" fill="#b5b5be" font-size="14">Require verified batch completion; reset for the next part.</text><text x="48" y="480" fill="#b5b5be" font-size="13">Validated completion, reset and part-removal conditions.</text><text x="48" y="501" fill="#777780" font-size="12">Functional overview · not a wiring or safety circuit drawing</text></g></svg>